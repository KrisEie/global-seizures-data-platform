# Local development only: published ports bind to this computer.
services:
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
  postgres-db:
    image: postgres:16
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in the repository-root .env}
      POSTGRES_DB: ${PG_DATABASE:-drug_seizures}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  mongodb:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-app}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:?Set MONGODB_PASSWORD in the repository-root .env}
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-drug_seizures_db}
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 10s
      retries: 12
  neo4j-db:
    image: neo4j:5-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in the repository-root .env}
      NEO4J_server_memory_heap_initial__size: 256M
      NEO4J_server_memory_heap_max__size: 512M
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 5s
      timeout: 10s
      retries: 24
  multi-db-app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:5000:5000"
    environment:
      PG_USER: ${PG_USER:-postgres}
      PG_HOST: postgres-db
      PG_DATABASE: ${PG_DATABASE:-drug_seizures}
      PG_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in the repository-root .env}
      PG_PORT: 5432
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_DB: ${MONGODB_DB:-drug_seizures_db}
      MONGODB_USER: ${MONGODB_USER:-app}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:?Set MONGODB_PASSWORD in the repository-root .env}
      MONGODB_AUTH_SOURCE: admin
      NEO4J_URI: bolt://neo4j-db:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in the repository-root .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      BIND_HOST: 0.0.0.0
      FRONTEND_ORIGIN: http://localhost:3000
      REACT_APP_API_URL: http://localhost:5000
      BROWSER: none
    depends_on:
      postgres-db:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      neo4j-db:
        condition: service_healthy
      kafka:
        condition: service_started
volumes:
  kafka-data:
  postgres-data:
  mongodb-data:
  neo4j-data:
